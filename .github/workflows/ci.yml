name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  GO_VERSION: '1.21'
  RUST_VERSION: '1.87.0'

permissions:
  contents: read

jobs:
  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        # v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Go
        # v5.6.0
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@v0.21.0

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted:"
            gofmt -d .
            exit 1
          fi

      - name: Check imports
        run: |
          if [ -n "$(goimports -l .)" ]; then
            echo "Go imports are not formatted:"
            goimports -d .
            exit 1
          fi

  go-verify:
    name: Go Module Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        # v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Go
        # v5.6.0
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download and verify Go modules (all modules)
        run: |
          set -e
          for d in apps/cli apps/agent apps/control-plane packages/shared packages/stellar; do
            echo "--- download and verify $d ---"
            (cd "$d" && go mod download ./... && go mod verify)
          done

  go-test:
    name: Go Test
    runs-on: ubuntu-latest
    needs: [go-lint, go-verify]
    permissions:
      contents: read
    steps:
      - name: Checkout code
        # v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Go
        # v5.6.0
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: |
          set -e
          (cd apps/cli && go mod download)
          (cd apps/agent && go mod download)
          (cd apps/control-plane && go mod download)
          (cd packages/shared && go mod download)
          (cd packages/stellar && go mod download)

      - name: Run tests per module (fail on first failure)
        run: |
          set -e
          # Run tests per module; keep -race where practical on Ubuntu
          (cd apps/cli && go test -v -race -coverprofile=coverage-cli.txt -covermode=atomic ./...)
          (cd apps/agent && go test -v -race -coverprofile=coverage-agent.txt -covermode=atomic ./...)
          (cd apps/control-plane && go test -v -race -coverprofile=coverage-control.txt -covermode=atomic ./...)
          (cd packages/shared && go test -v -race -coverprofile=coverage-shared.txt -covermode=atomic ./...)
          (cd packages/stellar && go test -v -race -coverprofile=coverage-stellar.txt -covermode=atomic ./...)

  go-build:
    name: Go Build
    runs-on: ubuntu-latest
    needs: [go-test]
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - app: cli
            binary: nova
          - app: agent
            binary: usenova-agent
          - app: control-plane
            binary: nova-control
    steps:
      - name: Checkout code
        # v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Go
        # v5.6.0
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build ${{ matrix.app }}
        run: |
          set -e
          cd apps/${{ matrix.app }}
          go build -v -o ../../bin/${{ matrix.binary }} .

      - name: Upload binary
        # v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.binary }}
          path: bin/${{ matrix.binary }}
          retention-days: 7

  govulncheck:
    name: Go Vulnerability Check (govulncheck)
    runs-on: ubuntu-latest
    needs: [go-lint, go-verify]
    permissions:
      contents: read
    # Tree currently has stdlib vulnerabilities with Go 1.22.2 in modules; goal is to turn failure on
    # after upgrading Go/toolchain. Start with continue-on-error until cleaned up.
    continue-on-error: true
    steps:
      - name: Checkout code
        # v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Go
        # v5.6.0
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install govulncheck (pinned version)
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Run govulncheck on main modules
        run: |
          set -e
          failed=0
          for d in apps/cli apps/agent apps/control-plane packages/stellar packages/shared; do
            echo "=== govulncheck $d ==="
            if ! (cd "$d" && govulncheck ./...); then
              echo "govulncheck failed in $d"
              failed=1
            fi
          done
          exit $failed

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout code
        # v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Dependency Review
        # v4.8.3
        uses: actions/dependency-review-action@05fe4576374b728f0c523d6a13d64c25081e0803
        # Requires GitHub Dependency graph; if this fails on forks/public setup, may need adjustment.

  rust-lint:
    name: Rust Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./contracts
    permissions:
      contents: read
    steps:
      - name: Checkout code
        # v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust
        # pinned to master commit of dtolnay/rust-toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.87.0
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Cargo
        # v4.2.4
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            contracts/target/
          key: ${{ runner.os }}-cargo-1.87-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-1.87-

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --lib --target wasm32-unknown-unknown -- -D warnings

  rust-test:
    name: Rust Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./contracts
    permissions:
      contents: read
    steps:
      - name: Checkout code
        # v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust
        # pinned to master commit of dtolnay/rust-toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.87.0
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        # v4.2.4
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            contracts/target/
          key: ${{ runner.os }}-cargo-1.87-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-1.87-

      - name: Run tests
        run: cargo test --lib --verbose

  rust-build:
    name: Rust Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./contracts
    permissions:
      contents: read
    steps:
      - name: Checkout code
        # v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust
        # pinned to master commit of dtolnay/rust-toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.87.0
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        # v4.2.4
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            contracts/target/
          key: ${{ runner.os }}-cargo-1.87-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-1.87-

      - name: Build contracts
        run: cargo build --release --target wasm32-unknown-unknown --lib

      - name: Upload contracts
        # v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: smart-contracts
          path: contracts/target/wasm32-unknown-unknown/release/*.wasm
          retention-days: 7
          if-no-files-found: warn
