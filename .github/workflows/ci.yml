name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  GO_VERSION: '1.21'
  RUST_VERSION: '1.87.0'

jobs:
  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@latest

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted:"
            gofmt -d .
            exit 1
          fi

      - name: Check imports
        run: |
          if [ -n "$(goimports -l .)" ]; then
            echo "Go imports are not formatted:"
            goimports -d .
            exit 1
          fi

  go-test:
    name: Go Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: |
          cd apps/cli && go mod download
          cd ../agent && go mod download
          cd ../control-plane && go mod download
          cd ../../packages/shared && go mod download
          cd ../stellar && go mod download

      - name: Run tests
        run: |
          cd apps/cli && go test -v -race -coverprofile=coverage-cli.txt -covermode=atomic ./... || true
          cd ../agent && go test -v -race -coverprofile=coverage-agent.txt -covermode=atomic ./... || true
          cd ../control-plane && go test -v -race -coverprofile=coverage-control.txt -covermode=atomic ./... || true
          cd ../../packages/shared && go test -v -race -coverprofile=coverage-shared.txt -covermode=atomic ./... || true
          cd ../stellar && go test -v -race -coverprofile=coverage-stellar.txt -covermode=atomic ./... || true

  go-build:
    name: Go Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [cli, agent, control-plane]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build ${{ matrix.app }}
        run: |
          cd apps/${{ matrix.app }}
          go build -v -o ../../bin/byoi-${{ matrix.app }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: byoi-${{ matrix.app }}
          path: bin/byoi-${{ matrix.app }}
          retention-days: 7

  rust-lint:
    name: Rust Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./contracts
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.87.0
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            contracts/target/
          key: ${{ runner.os }}-cargo-1.87-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-1.87-

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --lib --target wasm32-unknown-unknown -- -D warnings

  rust-test:
    name: Rust Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./contracts
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.87.0

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            contracts/target/
          key: ${{ runner.os }}-cargo-1.87-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-1.87-

      - name: Run tests
        run: cargo test --lib --verbose

  rust-build:
    name: Rust Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./contracts
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.87.0
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            contracts/target/
          key: ${{ runner.os }}-cargo-1.87-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-1.87-

      - name: Build contracts
        run: cargo build --release --target wasm32-unknown-unknown --lib

      - name: Upload contracts
        uses: actions/upload-artifact@v4
        with:
          name: smart-contracts
          path: contracts/target/wasm32-unknown-unknown/release/*.wasm
          retention-days: 7
          if-no-files-found: warn
